[package]
name = "schema-store"
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
publish = false
description = "SQLite persistence for Schema Designer, compatible with databases written by the Electrobun app"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
schema-domain = { path = "../domain" }

[dev-dependencies]
tempfile = "3"
