[package]
name = "schema-scenario"
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
publish = false
description = "The PostgREST emulation a Scenario's code talks to, over the sandbox database"

[dependencies]
schema-domain = { path = "../domain" }
schema-sandbox = { path = "../sandbox" }
pglite-oxide = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
anyhow = "1"
url = "2"
base64 = "0.22"
