[package]
name = "schema-workspace"
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
publish = false
description = "The design workspace behind the view: open Project, edits, autosave and SQL preview"

[dependencies]
schema-domain = { path = "../domain" }
schema-store = { path = "../store" }
schema-sandbox = { path = "../sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
regex = "1"
