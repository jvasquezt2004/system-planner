name: Packaged Proof Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: ["agent/**", "main"]
  workflow_dispatch:

jobs:
  linux-proof:
    name: Linux Packaged Proof (WebKitGTK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Hutch CLI
        run: |
          curl -fsSL https://hutch.build/install.sh | bash
          echo "$HOME/.hutch/bin" >> $GITHUB_PATH

      - name: Prepare devkit
        run: hutch electrobun prepare

      - name: Run unit & invariant tests
        run: bun test src/shared/architecture-proof.test.ts src/mainview/architecture-proof/svg-export.test.ts

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Build frontend views
        run: bun x vite build

      - name: Build packaged Linux app
        run: hutch electrobun build --env=stable

      - name: Verify packaged proof
        run: bun scripts/verify-packaged-proof.ts

  windows-proof:
    name: Windows Packaged Proof (WebView2)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Hutch CLI
        run: |
          powershell -c "irm https://hutch.build/install.ps1 | iex"
          echo "$HOME/.hutch/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare devkit
        run: hutch electrobun prepare

      - name: Run unit & invariant tests
        run: bun test src/shared/architecture-proof.test.ts src/mainview/architecture-proof/svg-export.test.ts

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Build frontend views
        run: bun x vite build

      - name: Build packaged Windows app
        run: hutch run build

      - name: Verify packaged proof
        run: bun scripts/verify-packaged-proof.ts
