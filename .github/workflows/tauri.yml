name: Tauri rewrite

on:
  pull_request:
    paths: ["src-tauri/**", "src/**", "index.html", "vite.config.ts", "package.json", "bun.lock", "tsconfig.json", ".github/workflows/tauri.yml"]
  push:
    branches: [main, rewrite]
    paths: ["src-tauri/**", "src/**", "index.html", "vite.config.ts", "package.json", "bun.lock", "tsconfig.json", ".github/workflows/tauri.yml"]
  workflow_dispatch:

jobs:
  rust:
    name: Rust tests and view tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: View tests and type check
        run: bun run test && bun run typecheck
      - name: Rust tests
        run: cd src-tauri && cargo test --workspace

  package:
    name: Build the app
    needs: rust
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: schema-designer-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
