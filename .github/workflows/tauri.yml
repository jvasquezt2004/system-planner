name: Tauri rewrite

on:
  pull_request:
    paths: ["tauri/**", "src/shared/**", "src/bun/**", ".github/workflows/tauri.yml"]
  push:
    branches: [main, rewrite]
    paths: ["tauri/**", "src/shared/**", "src/bun/**", ".github/workflows/tauri.yml"]
  workflow_dispatch:

jobs:
  rust:
    name: Rust tests and fixture drift
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - name: Install dependencies
        run: bun install --frozen-lockfile && (cd tauri && bun install --frozen-lockfile)
      # The TypeScript code is the oracle. Regenerating the fixtures must change nothing.
      - name: Regenerate fixtures
        run: cd tauri && bun run fixtures
      - name: Fixtures are up to date
        run: git diff --exit-code -- tauri/fixtures/data tauri/src-tauri/crates/domain/data
      - name: Rust tests
        run: cd tauri/src-tauri && cargo test --workspace

  package:
    name: Build the app
    needs: rust
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - name: Install dependencies
        run: bun install --frozen-lockfile && cd tauri && bun install --frozen-lockfile
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build
        run: cd tauri && cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: schema-designer-${{ matrix.os }}
          path: tauri/src-tauri/target/release/bundle/**
